<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Sneakers Freak</title>
	<link rel="icon" type="image/x-icon" href="images/379766373_1221297508514345_7529543329631078454_n_1_.ico">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

	<link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css?family=Rokkitt:100,300,400,700" rel="stylesheet">

	<!-- Animate.css -->
	<link rel="stylesheet" href="css/animate.css">
	<!-- Icomoon Icon Fonts -->
	<link rel="stylesheet" href="css/icomoon.css">
	<!-- Ion Icon Fonts -->
	<link rel="stylesheet" href="css/ionicons.min.css">
	<!-- Bootstrap  -->
	<link rel="stylesheet" href="css/bootstrap.min.css">

	<!-- Magnific Popup -->
	<link rel="stylesheet" href="css/magnific-popup.css">

	<!-- Flexslider -->
	<link rel="stylesheet" href="css/flexslider.css">

	<!-- Owl Carousel -->
	<link rel="stylesheet" href="css/owl.carousel.min.css">
	<link rel="stylesheet" href="css/owl.theme.default.min.css">

	<!-- Date Picker -->
	<link rel="stylesheet" href="css/bootstrap-datepicker.css">
	<!-- Flaticons  -->
	<link rel="stylesheet" href="fonts/flaticon/font/flaticon.css">

	<!-- Theme style  -->
	<link rel="stylesheet" href="css/style.css">

	<style>
		.box {
			max-width: 1200px;
		}

		.login-box {
			position: relative;
		}

		.input-field {
			width: 350px;
			display: block;
			padding: 5px 20px;
			margin-bottom: 10px;
		}

		.login-box .l-text {
			margin-bottom: 40px;
			font-weight: bold;
			margin-top: 100px;
			font-size: 26px;
			color: #68beb9;
		}

		.label {
			margin-bottom: 5px;
			font-weight: bold;
			color: #68beb9;
		}

		.r-label {
			margin-top: 10px;
			text-decoration: underline;
			cursor: pointer;
			margin-bottom: 5px;
			font-weight: bold;
			color: #68beb9;
		}

		.box-text {
			display: inline;
			margin-left: 20px;
			color: #68beb9;
		}

		.submit-btn {
			display: block;
			padding: 5px 25px;
			background-color: #68beb9;
			outline: none;
			cursor: pointer;
			border: none;
			margin-top: 40px;
			border-radius: 10px;
			width: 350px;
		}

		.positioning {
			position: relative;
			margin: auto;
		}

		@media (max-width :380px) {
			.submit-btn {
				width: 320px;
			}

			.input-field {
				width: 320px;
			}
		}

		@media (max-width :330px) {
			.submit-btn {
				width: 280px;
			}

			.input-field {
				width: 280px;
			}
		}

		@media (max-width :873px) {
			.positioning {
				position: relative;
				margin: 200px;
			}
		}

		@media (max-width :1200px) {
			.shoe1 {
				width: 600px;
			}
		}

		@media (max-width :1000px) {
			.shoe1 {
				width: 0px;
			}
		}

		.shoe1 {
			position: absolute;
			top: 231px;
			right: 43px;
		}

		.imgInput {
			position: absolute;
			top: 231px;
			right: 43px;
		}
		
		.username{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: large;
            font-weight: 400;
        }
    
	</style>
</head>

<body>
	<div id="page">
		<!-- Admin Navigation Bar -->
		<div th:insert="adminNavbar.html"></div>

		<img src="https://imgs.search.brave.com/v9GscgePg_iBfjOfubbefIY8EF3M4J7UJkDr6Do_pVg/rs:fit:860:0:0:0/g:ce/aHR0cDovL3BuZ2lt/Zy5jb20vdXBsb2Fk/cy9mb290YmFsbF9i/b290cy9mb290YmFs/bF9ib290c19QTkc1/OS5wbmc"
            alt="" class="shoe1" style="position: absolute;">

		<div class="container box">
			<div class="positioning">

				<p align="left"
					style="margin-bottom: 40px; font-weight: bold; margin-top: 100px; font-size: 26px; color: #68beb9;">
					Add
					Shoe</p>

				<form action="/admin" method="post" class="form" id="form" enctype="multipart/form-data">

					<div class="form1">
						<label class="label">Image</label>
						<input type="file" name="file" class="input-field" autocomplete="off"
							style="width: 350px; display: block; padding: 5px 20px; margin-bottom: 10px;">
						<div class="invalid-feedback"></div>
					</div>

					<div class="form1">
						<label class="label">Name</label>
						<input type="text" name="shoeName" class="input-field" autocomplete="off"
							style="width: 350px; display: block; padding: 5px 20px; margin-bottom: 10px;">
						<div class="invalid-feedback"></div>
					</div>

					<p class="label">Brand</p>
					<input type="text" name="brand" class="input-field" autocomplete="off"
						style="width: 350px; display: block; padding: 5px 20px; margin-bottom: 10px;">
					<div class="invalid-feedback"></div>


					<p class="label">Size(UK)</p>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox" name="size" value="9"> <label
							class="form-check-label">9</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox" name="size" value="10"> <label
							class="form-check-label">10</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox" name="size" value="11"> <label
							class="form-check-label">11</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox" name="size" value="12"> <label
							class="form-check-label">12</label>
					</div>
					<div class="invalid-feedback"></div>


					<p class="label">Color</p>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox" id="inlineCheckbox2" name="color" value="black">
						<label class="form-check-label" for="inlineCheckbox2">Black</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox" id="inlineCheckbox2" name="color" value="red">
						<label class="form-check-label" for="inlineCheckbox2">Red</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox" id="inlineCheckbox2" name="color" value="brown">
						<label class="form-check-label" for="inlineCheckbox2">Brown</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox" id="inlineCheckbox2" name="color" value="white">
						<label class="form-check-label" for="inlineCheckbox2">White</label>
					</div>
					<div class="invalid-feedback"></div>

					<p class="label">Year</p>
					<input type="text" name="year" class="input-field" autocomplete="off"
						style="width: 350px; display: block; padding: 5px 20px; margin-bottom: 10px;">
					<div class="invalid-feedback"></div>

					<p class="label">Price</p>
					<input type="text" name="price" class="input-field" autocomplete="off"
						style="width: 350px; display: block; padding: 5px 20px; margin-bottom: 10px;">
					<div class="invalid-feedback"></div>

					<input type="checkbox" class="check-box">
					<p class="box-text">Remember me.</p>

					<input style="height: 43px;" type="submit" name="LOGIN" class="submit-btn" align="center">

				</form>
			</div>
		</div>


		<!-- footer -->
		<div th:insert="footer.html"></div>
	</div>





	jQuery
	<script src="js/jquery.min.js"></script>
	popper
	<script src="js/popper.min.js"></script>
	bootstrap 4.1
	<script src="js/bootstrap.min.js"></script>
	jQuery easing
	<script src="js/jquery.easing.1.3.js"></script>
	Waypoints
	<script src="js/jquery.waypoints.min.js"></script>
	Flexslider
	<script src="js/jquery.flexslider-min.js"></script>
	Owl carousel
	<script src="js/owl.carousel.min.js"></script>
	Magnific Popup
	<script src="js/jquery.magnific-popup.min.js"></script>
	<script src="js/magnific-popup-options.js"></script>
	Date Picker
	<script src="js/bootstrap-datepicker.js"></script>
	Stellar Parallax
	<script src="js/jquery.stellar.min.js"></script>
	Main
	<script src="js/main.js"></script>


</body>

</html>
