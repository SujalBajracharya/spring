<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Sneakers Freak</title>
	<link rel="icon" type="image/x-icon" href="/images/379766373_1221297508514345_7529543329631078454_n_1_.ico">
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">


	<!-- Animate.css -->
	<link rel="stylesheet" href="/css/animate.css">
	<!-- Icomoon Icon Fonts-->
	<link rel="stylesheet" href="/css/icomoon.css">
	<!-- Ion Icon Fonts-->
	<link rel="stylesheet" href="/css/ionicons.min.css">
	<!-- Bootstrap  -->
	<link rel="stylesheet" href="/css/bootstrap.min.css">

	<!-- Magnific Popup -->
	<link rel="stylesheet" href="/css/magnific-popup.css">

	<!-- Flexslider  -->
	<link rel="stylesheet" href="/css/flexslider.css">

	<!-- Owl Carousel -->
	<link rel="stylesheet" href="/css/owl.carousel.min.css">
	<link rel="stylesheet" href="/css/owl.theme.default.min.css">

	<!-- Date Picker -->
	<link rel="stylesheet" href="/css/bootstrap-datepicker.css">
	<!-- Flaticons  -->
	<link rel="stylesheet" href="/fonts/flaticon/font/flaticon.css">

	<!-- Theme style  -->
	<link rel="stylesheet" href="/css/style.css">

</head>

<body>

	<div class="colorlib-loader"></div>

	<div id="page">
		<!-- navbar -->
		<div th:insert="components/navbar.html"></div>

		<aside id="colorlib-hero">
			<div class="flexslider">
				<ul class="slides">
					<li style="background-image: url(images/18.jpg);">
						<div class="overlay"></div>
						<div class="container-fluid">
							<div class="row">
								<div class="col-sm-6 offset-sm-3 text-center slider-text">

								</div>
							</div>
						</div>
					</li>
					<li style="background-image: url(images/17.jpg);">
						<div class="overlay"></div>
						<div class="container-fluid">
							<div class="row">
								<div class="col-sm-6 offset-sm-3 text-center slider-text">

								</div>
							</div>
						</div>
					</li>
					<li style="background-image: url(images/19.jpg);">
						<div class="overlay"></div>
						<div class="container-fluid">
							<div class="row">
								<div class="col-sm-6 offset-sm-3 text-center slider-text">

								</div>
							</div>
						</div>
					</li>
				</ul>
			</div>
		</aside>
		<div class="colorlib-intro">
			<div class="container">
				<div class="row">
					<div class="col-sm-12 text-center">
						<h2 class="intro">It started with a simple idea: Create
							quality, well-designed products that I wanted myself.</h2>
					</div>
				</div>
			</div>
		</div>
		<div class="colorlib-product">
			<div class="container-fluid">
				<div class="row">
					<div class="col-sm-6 text-center">
						<div class="featured">
							<a href="#" class="featured-img" style="background-image: url(images/men.jpg);"></a>
							<div class="desc">
								<h2>
									<a href="pages/men.jsp">Men</a>
								</h2>
							</div>
						</div>
					</div>
					<div class="col-sm-6 text-center">
						<div class="featured">
							<a href="#" class="featured-img" style="background-image: url(images/women.jpg);"></a>
							<div class="desc">
								<h2>
									<a href="#">Women</a>
								</h2>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>













		<div class="colorlib-product">
			<div class="container">
				<div class="row">
					<div class="col-sm-8 offset-sm-2 text-center colorlib-heading">
						<h2>Best Sellers</h2>
					</div>
				</div>

				<!-- Backend Filter -->
				<form action="searchByPrice" method="post">
					<label class="">Price</label>
					
					<label for="">min:-</label>
					<input type="text" name="minPrice" id="minPrice">
					<label for="">max:-</label>
					<input type="text" name="maxPrice" id="maxPrice">
					
					<input type="submit" value="search">
				</form>

				<hr>
				<form action="searchByBrand" method="post">
					<label class="">Brand</label>
					
					<div class="custom-control custom-radio">
						<input type="radio" id="customRadio1" name="brand" class="custom-control-input" value="messi">
						<label class="custom-control-label" for="customRadio1">messi</label>
					</div>
					<div class="custom-control custom-radio">
						<input type="radio" id="customRadio2" name="brand" class="custom-control-input" value="nike">
						<label class="custom-control-label" for="customRadio2">Nike</label>
					</div>
					
					<input type="submit" value="search">
				</form>

				<hr>
				<form action="searchBySize" method="post">
					<label for=""> Sizes </label>
					
					<input type="checkbox" name="size" id="size" value="9">
					<label for="">9</label>
					<input type="checkbox" name="size" id="size" value="10">
					<label for="">10</label>
					<input type="checkbox" name="size" id="size" value="11">
					<label for="">11</label>
					<input type="checkbox" name="size" id="size" value="12">
					<label for="">12</label>
					<input type="submit" value="search">
				</form>


				<div class="row row-pb-md">
					<!-- show shoe from database -->
					<div class="col-lg-3 mb-4 text-center" th:each="s : ${allShoeData}">
						<div class="product-entry border">
							<a href="" class="prod-img"> <img th:src="'data:image/jpeg;base64,' + ${s.image}"
									class="img-fluid" alt="">
							</a>
							<div class="desc">
								<h2>
									<a href="pages/buyPage.jsp">
										<div th:text="${s.shoeName}"></div>
									</a>
								</h2>
								<span class="price">
									<div th:text="${s.price}"></div>
								</span>
								<form action="productDetail" method="post">
									<input type="text" th:value="${s.id}" style="visibility: hidden;" name="id">
									<input type="submit" value="view">
								</form>
							</div>
						</div>
					</div>
				</div>
				<div class="row">
					<div class="col-md-12 text-center">
						<p>
							<a href="#" class="btn btn-primary btn-lg">Shop All Products</a>
						</p>
					</div>
				</div>
			</div>
		</div>



		<div th:insert="footer.html"></div>
	</div>



	<!-- jQuery -->
	<script src="js/jquery.min.js"></script>
	<!-- popper -->
	<script src="js/popper.min.js"></script>
	<!-- bootstrap 4.1 -->
	<script src="js/bootstrap.min.js"></script>
	<!-- jQuery easing -->
	<script src="js/jquery.easing.1.3.js"></script>
	<!-- Waypoints -->
	<script src="js/jquery.waypoints.min.js"></script>
	<!-- Flexslider -->
	<script src="js/jquery.flexslider-min.js"></script>
	<!-- Owl carousel -->
	<script src="js/owl.carousel.min.js"></script>
	<!-- Magnific Popup -->
	<script src="js/jquery.magnific-popup.min.js"></script>
	<script src="js/magnific-popup-options.js"></script>
	<!-- Date Picker -->
	<script src="js/bootstrap-datepicker.js"></script>
	<!-- Stellar Parallax -->
	<script src="js/jquery.stellar.min.js"></script>
	<!-- Main -->
	<script src="js/main.js"></script>

</body>

</html>
