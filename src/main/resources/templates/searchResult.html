<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
<title>Sneakers Freak</title>
<link rel="icon" type="image/x-icon"
	href="/images/379766373_1221297508514345_7529543329631078454_n_1_.ico">
<link rel="stylesheet"
	href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
	integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
	crossorigin="anonymous">
<meta charset="utf-8">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">


<!-- Animate.css -->
<link rel="stylesheet" href="/css/animate.css">
<!-- Icomoon Icon Fonts-->
<link rel="stylesheet" href="/css/icomoon.css">
<!-- Ion Icon Fonts-->
<link rel="stylesheet" href="/css/ionicons.min.css">
<!-- Bootstrap  -->
<link rel="stylesheet" href="/css/bootstrap.min.css">

<!-- Magnific Popup -->
<link rel="stylesheet" href="/css/magnific-popup.css">

<!-- Flexslider  -->
<link rel="stylesheet" href="/css/flexslider.css">

<!-- Owl Carousel -->
<link rel="stylesheet" href="/css/owl.carousel.min.css">
<link rel="stylesheet" href="/css/owl.theme.default.min.css">

<!-- Date Picker -->
<link rel="stylesheet" href="/css/bootstrap-datepicker.css">
<!-- Flaticons  -->
<link rel="stylesheet" href="/fonts/flaticon/font/flaticon.css">

<!-- Theme style  -->
<link rel="stylesheet" href="/css/style.css">

</head>

<body>
	<div th:insert="components/navbar"></div>
	<style>
.image {
	width: 100px;
	/* Set the width of the image */
	height: 100px;
	/* Set the height of the image to make it a square */
	object-fit: cover;
	/* Ensure the image fills the square and is cropped if necessary */
	border-radius: 5px;
	/* Optional: Add slight rounding to the corners */
	display: block;
	/* Make sure the image behaves as a block element */
	margin: auto;
}
</style>

	<h1 style="margin-left: 8%; margin-bottom: 8%; margin-top: 3%;">Search
		Results:</h1>

	<!-- filterButton -->
	<li class="has-dropdown"><a href="#">Filter</a>
		<ul class="dropdown">
			<li class="has-dropdown"><a href="filterByPrice">Price</a>
				<ul>
					<div>
						<label for="priceRange">Filter by Price (Rs): </label> <input
							type="range" id="priceRange" min="5000" max="15000" step="100"
							oninput="filterItems()"> <span id="priceValue">Rs
							10000</span>
					</div>
				</ul></li>

			<!-- filterBySize -->
			<li class="has-dropdown"><a href="filterBySize">Size</a>
				<form action="searchBySize" method="post">
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox"
							id="formControlSize9" value="9" name="size"> <label
							class="form-check-label" for="inlineCheckbox1">9</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox"
							id="formControlSize10" value="10" name="size"> <label
							class="form-check-label" for="inlineCheckbox2">10</label>
					</div>
					<div class="form-check form-check-inline">
						<div class="form-check form-check-inline">
							<input class="form-check-input" type="checkbox"
								id="formControlSize11" value="11" name="size"> <label
								class="form-check-label" for="inlineCheckbox2">11</label>
						</div>
					</div>
					<input class="form-check-input" type="checkbox"
						id="formControlSize12" value="12" name="size"> <label
						class="form-check-label" for="inlineCheckbox2">12</label>
					</div>
					<input type="submit" value="search">
				</form></li>

			<!-- filterByColour -->
			<li class="has-dropdown"><a href="filterByColor">Colour</a>
				<form action="searchByColor" method="post">
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox"
							id="formControlColorBlack" value="black" name="color"> <label
							class="form-check-label" for="inlineCheckbox1">Black</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox"
							id="formControlColorWhite" value="white" name="color"> <label
							class="form-check-label" for="inlineCheckbox2">White</label>
					</div>
					<div class="form-check form-check-inline">
						<input class="form-check-input" type="checkbox"
							id="formControlColorRed" value="red" name="color"> <label
							class="form-check-label" for="inlineCheckbox2">Red</label>
					</div>
					<div class="form-check form-check-inline"></div>
					<input class="form-check-input" type="checkbox"
						id="formControlColorBrown" value="brown" name="color"> <label
						class="form-check-label" for="inlineCheckbox2">Brown</label>
					</div>
					<input type="submit" value="search">
				</form></li>
		</ul></li>

	<!-- endOfFilterButton -->





	<div class="container">
		<div id="shoeCardsContainer">
			<div class="row row-pb-md">
				<div class="card" style="width: 18rem;"
					th:each="s : ${searchResults}">
					<img th:src="'data:image/jpeg;base64,' + ${s.image}"
						class="card-img-top" alt="Shoe Image">
					<div class="card-body">
						<h6 class="card-title" th:text="${s.brand}"></h6>
						<h3 class="card-title" th:text="${s.shoeName}"></h3>
						
						<h5 class="card-title price" th:text="'Rs '+${s.price}"></h5>


						<span class="badge badge-primary" th:each="sizeValue : ${s.sizes}"
							th:text="${sizeValue.size}"></span>


						<hr>
						<li class="color" th:each="colorValue : ${s.colors}">
							<div class="small-box" th:style="'background-color:' + ${colorValue.color}"></div>
							</li>

<style>
.small-box {
            width: 30px;
            height: 30px;
            border: 1px solid #000;  
        }
</style>



						<p class="card-text">Some quick example text to build on the
							card title and make up the bulk of the card's content.</p>
						<form action="productDetail" method="post">
							<input type="text" th:value="${s.id}" style="visibility: hidden;"
								name="id"> <input type="submit" value="view"
								class="btn btn-primary">
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- Pagination controls -->
	<div class="pagination-controls">
		<span th:text="'Page ' + ${currentPage + 1} + ' of ' + ${totalPages}"></span>

		<div>
			<a th:href="@{/searchShoes(query=${query}, page=${currentPage - 1})}"
				th:if="${currentPage > 0}">Previous</a> <a
				th:href="@{/searchShoes(query=${query}, page=${currentPage + 1})}"
				th:if="${currentPage + 1 < totalPages}">Next</a>
		</div>
	</div>

	<!-- footer -->
	<div th:insert="components/footer.html"></div>

	<script>
		function filterItems() {
			// Get the selected price
			var priceLimit = document.getElementById("priceRange").value;
			document.getElementById("priceValue").textContent = 'Rs ' + priceLimit;

			// Get all selected sizes
			var selectedSizes = Array.from(document.querySelectorAll("input[id^='formControlSize']:checked")).map(cb => cb.value);

			// Get all selected colors
			var selectedColors = Array.from(document.querySelectorAll("input[id^='formControlColor']:checked")).map(cb => cb.value);

			// Get all shoe cards
			var shoeCards = document.querySelectorAll("#shoeCardsContainer .card");

			shoeCards.forEach(function (card) {
				// Get price from card
				var priceText = card.querySelector(".price").textContent;
				var price = parseInt(priceText.replace("Rs ", ""));

				// Get sizes from card
				var sizeElements = card.querySelectorAll(".badge-primary");
				var sizes = Array.from(sizeElements).map(span => span.textContent.trim());

				// Get colors from card
				var colorElements = card.querySelectorAll(".color");
				var colors = Array.from(colorElements).map(li => li.textContent.trim().toLowerCase());


				// Check if the card matches the filters
				var matchesPrice = price <= priceLimit;
				var matchesSize = selectedSizes.length === 0 || sizes.some(size => selectedSizes.includes(size));
				var matchesColor = selectedColors.length === 0 || colors.some(color => selectedColors.includes(color));

				// Show or hide card based on filters
				if (matchesPrice && matchesSize && matchesColor) {
					card.style.display = "block";
				} else {
					card.style.display = "none";
				}
			});
		}

		// Add event listeners to the filters to call the filterItems function when changed
		document.getElementById("priceRange").addEventListener("input", filterItems);

		document.querySelectorAll("input[id^='formControlSize']").forEach(input => {
			input.addEventListener("change", filterItems);
		});

		document.querySelectorAll("input[id^='formControlColor']").forEach(input => {
			input.addEventListener("change", filterItems);
		});
	</script>






</body>




</html>
