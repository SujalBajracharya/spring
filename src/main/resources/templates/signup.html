	crossorigin="anonymous">

<style>
.box {
	max-width: 1200px;
}

.login-box {
	position: relative;
}

.input-field {
	width: 350px;
	display: block;
	padding: 5px 20px;
	margin-bottom: 10px;
}

.login-box .l-text {
	margin-bottom: 40px;
	font-weight: bold;
	margin-top: 100px;
	font-size: 26px;
	color: #68beb9;
}

.label {
	margin-bottom: 5px;
	font-weight: bold;
	color: #68beb9;
}

.r-label {
	margin-top: 10px;
	text-decoration: underline;
	cursor: pointer;
	margin-bottom: 5px;
	font-weight: bold;
	color: #68beb9;
}

.box-text {
	display: inline;
	margin-left: 20px;
	color: #68beb9;
}

.submit-btn {
	display: block;
	padding: 5px 25px;
	background-color: #68beb9;
	outline: none;
	cursor: pointer;
	border: none;
	margin-top: 40px;
	border-radius: 10px;
	width: 350px;
}

.positioning {
	position: relative;
	margin: auto;
}

@media ( max-width :380px) {
	.submit-btn {
		width: 320px;
	}
	.input-field {
		width: 320px;
	}
}

@media ( max-width :330px) {
	.submit-btn {
		width: 280px;
	}
	.input-field {
		width: 280px;
	}
}

@media ( max-width :873px) {
	.positioning {
		position: relative;
		margin: 200px;
	}
}

@media ( max-width :1200px) {
	.shoe1 {
		width: 600px;
	}
}

@media ( max-width :1000px) {
	.shoe1 {
		width: 0px;
	}
}

.shoe1 {
	position: absolute;
	top: 231px;
	right: 43px;
}
</style>
</head>

<body>
	<div id="page">
		<nav class="colorlib-nav">
			<div class="top-menu">
				<div class="container">
					<div class="row">
						<div class="col-sm-7 col-md-9">
							<div id="colorlib-logo">
								<a href="../index.jsp">Sneakers Freak</a>
							</div>
						</div>
						<div class="col-sm-5 col-md-3">
							<form action="#" class="search-wrap">
								<div class="form-group">
									<input type="search" class="form-control search"
										placeholder="Search">
									<button class="btn btn-primary submit-search text-center"
										type="submit">
										<i class="icon-search"></i>
									</button>
								</div>
							</form>
						</div>
					</div>
					<div class="row">
						<div class="col-sm-12 text-left menu-1">
							<ul>
								<li><a href="../index.jsp">Home</a></li>
								<li class="has-dropdown"><a href="men.jsp">Men</a>
									<ul class="dropdown">
										<li><a href="#">Product Detail</a></li>
										<li><a href="#">Shopping Cart</a></li>
										<li><a href="#">Checkout</a></li>
										<li><a href="#">Order Complete</a></li>
										<li><a href="#">Wishlist</a></li>
									</ul></li>
								<li><a href="#">Women</a></li>
								<li><a href="about.jsp">About</a></li>
								<li><a href="contact.jsp">Contact</a></li>

								<li class="cart">
									<div class="col-sm-7 col-md-9">
										<div id="btn">
											<a href="login.jsp"><button class="btn-primary"
													style="width: 226px; border-radius: 20px;">Log in</button></a>
										</div>
									</div>
								</li>
								<li class="cart"><a href="cart.jsp"><i
										class="icon-shopping-cart"></i> Cart [0]</a></li>
							</ul>
						</div>
					</div>
				</div>
			</div>


			<div class="sale">
				<div class="container">
					<div class="row">
						<div class="col-sm-8 offset-sm-2 text-center">
							<div class="row">
								<div class="carousel2">
									<div class="item">
										<div class="col">
											<h3>
												<a href="#">25% off (Almost) Everything! Use Code:
													Summer Sale</a>
											</h3>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</nav>

		<img
			src="https://img.freepik.com/free-vector/color-sport-sneaker_98292-3191.jpg?w=826&t=st=1696068999~exp=1696069599~hmac=df263c36e3894ec317095dd6e92e8ac082f06431843f8a6da13763b136f4541b"
			alt="" class="shoe1" style="position: absolute;">


		<div class="container box">
			<div class="positioning">

				<p align="left"
					style="margin-bottom: 40px; font-weight: bold; margin-top: 100px; font-size: 26px; color: #68beb9;">REGISTER</p>



				<form th:action="@{/signup}" method="post" th:object="${u}">

					<div class="form-group">
						<label for="username">Username</label> <input type="text"
							id="username" class="form-control" th:field="*{username}">
						<div class="invalid-feedback"
							th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
					</div>

					<input type="checkbox" class="check-box">
					<p class="box-text">I Accept terms & Conditions</p>

					<input style="height: 43px;" type="submit" name="REGISTER"
						class="submit-btn" align="center" value="register"> <a
						href="login"><p class="r-label" align="left"
							style="text-decoration: none;">Login Here</p></a>

				</form>




			</div>
		</div>



		<!-- Js -->


		<div th:insert="footer.html"></div>
	</div>



	<!-- Js -->


	<!-- jQuery -->
	<script src="js/jquery.min.js"></script>
	<!-- popper -->
	<script src="js/popper.min.js"></script>
	<!-- bootstrap 4.1 -->
	<script src="js/bootstrap.min.js"></script>
	<!-- jQuery easing -->
	<script src="js/jquery.easing.1.3.js"></script>
	<!-- Waypoints -->
	<script src="js/jquery.waypoints.min.js"></script>
	<!-- Flexslider -->
	<script src="js/jquery.flexslider-min.js"></script>
	<!-- Owl carousel -->
	<script src="js/owl.carousel.min.js"></script>
	<!-- Magnific Popup -->
	<script src="js/jquery.magnific-popup.min.js"></script>
	<script src="js/magnific-popup-options.js"></script>
	<!-- Date Picker -->
	<script src="js/bootstrap-datepicker.js"></script>
	<!-- Stellar Parallax -->
	<script src="js/jquery.stellar.min.js"></script>

	<script src="js/main.js"></script>
