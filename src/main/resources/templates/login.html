    <!-- Js -->

    <!-- Js -->
    <script>
        const form = document.getElementById("form");
        const username = document.getElementById("username");
        const password = document.getElementById("password");


        form.addEventListener("submit", (e) => {
            e.preventDefault();
            let isValid = checkInputs();
            if (isValid) {
                form.submit();
            }
        });

        function checkInputs() {
            let isValid = false;
            const usernameValue = username.value.trim();

            const passwordValue = password.value.trim();


            // Username validation
            if (usernameValue === "") {
                setErrorFor(username, "Username cannot be blank");
            } else if (usernameValue.length < 3 || usernameValue.length > 15) {
                setErrorFor(username, "Username must be between 3 and 15 characters");
            } else {
                setSuccessFor(username);
                isValid = true;
            }

            // Password validation
            if (passwordValue === "") {
                setErrorFor(password, "Password cannot be blank");
            } else if (passwordValue.length < 8 || passwordValue.length > 20) {
                setErrorFor(password, "Password must be between 8 and 20 characters");
            } else if (!/[A-Z]/.test(passwordValue)) {
                setErrorFor(password, "Password must contain at least one uppercase letter");
            } else if (!/[a-z]/.test(passwordValue)) {
                setErrorFor(password, "Password must contain at least one lowercase letter");
            } else if (!/[0-9]/.test(passwordValue)) {
                setErrorFor(password, "Password must contain at least one digit");
            } else if (!/[!@#$%^&*(),.?":{}|<>]/.test(passwordValue)) {
                setErrorFor(password, "Password must contain at least one special character");
            } else {
                setSuccessFor(password);
                isValid = true;
            }
            return isValid;
        }

        function setErrorFor(input, message) {
            const formControl = input.parentElement; // .form1
            const small = formControl.querySelector("small");
            small.innerText = message;

            formControl.className = "form1 error";
        }

        function setSuccessFor(input) {
            const formControl = input.parentElement; // .form1
            formControl.className = "form1 success";
        }

        // Toggle Password Visibility
		const togglePassword = document.querySelector('#togglePassword');
		const passwordEye = document.querySelector('#password');

		togglePassword.addEventListener('click', function () {
			const type = passwordEye.getAttribute('type') === 'password' ? 'text' : 'password';
			passwordEye.setAttribute('type', type);
			this.classList.toggle('bi-eye');
			this.classList.toggle('bi-eye-slash');
		});
    </script>
