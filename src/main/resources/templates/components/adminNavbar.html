<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleNavBar</title>
</head>
<body>
    
    <nav class="colorlib-nav">
        <div class="top-menu">
            <div class="container">
                <div class="row">
                    <div class="col-sm-7 col-md-9">
                        <div id="colorlib-logo">
                            <a href="../index.jsp">Sneakers Freak</a>
                        </div>
                    </div>
                    <div class="col-sm-5 col-md-3">
                        <div th:text="'Hi how have you been ' + ${session.user} + ' ?'" class="username"></div>
                    </div>
                </div>
                <div class="row">
                    <div class="col-sm-12 text-left menu-1">
                        <ul>
                            <li><a href="inventory">Inventory</a></li>
                            <li><a href="changePassword">Reset Password</a></li>
                            <li><a href="orders"> Orders </a></li>
                            

                            <li class="cart">
                                <div class="col-sm-7 col-md-9">
                                    <!-- <div th:text="${userData.getUsername}"></div> -->
									
									<!-- Show Log out button only if session.user is not null -->
									<div id="btn" th:if="${session.user != null}">
										<a href="logout">
											<button class="btn-primary"
												style="width: 226px; border-radius: 20px;">Log out</button>
										</a>
									</div>

									<!-- Show Log in button only if session.user is null -->
									<div id="btn" th:unless="${session.user != null}">
										<a href="login">
											<button class="btn-primary"
												style="width: 226px; border-radius: 20px;">Log in</button>
										</a>
									</div>
                                </div>
                            </li>                        
                        </ul>
                    </div>
                </div>
            </div>
        </div>


        <div class="sale">
            <div class="container">
                <div class="row">
                    <div class="col-sm-8 offset-sm-2 text-center">
                        <div class="row">
                            <div class="carousel2">
                                <div class="item">
                                    <div class="col">
                                        <h3>
                                            <a href="#"></a>
                                        </h3>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</body>
</html>
